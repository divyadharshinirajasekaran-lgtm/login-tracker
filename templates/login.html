{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-85 py-5">
  <div class="col-md-5 col-lg-4">
    <div class="text-center mb-4">
      <div class="brand-icon mb-3"><i class="bi bi-shield-lock-fill"></i></div>
      <h2 class="fw-bold">Welcome Back</h2>
      <p class="text-muted">Sign in to your secure account</p>
    </div>
    <div class="card login-card p-4">
      <form method="POST" action="/login">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
            <button class="btn btn-outline-secondary" type="button" onclick="togglePw()"><i class="bi bi-eye" id="eye-icon"></i></button>
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label small" for="remember">Remember me</label>
          </div>
          <a href="#" class="small text-primary text-decoration-none">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>
      <hr class="my-3">
      <p class="text-center small mb-0 text-muted">
        Don't have an account? <a href="/register" class="text-primary fw-semibold">Register here</a>
      </p>
    </div>
    <p class="text-center mt-3 small text-muted">
      <i class="bi bi-shield-check me-1 text-success"></i>Your connection is secure and monitored
    </p>
  </div>
</div>
<script>
function togglePw() {
  const pw = document.getElementById('password');
  const icon = document.getElementById('eye-icon');
  if (pw.type === 'password') { pw.type = 'text'; icon.className = 'bi bi-eye-slash'; }
  else { pw.type = 'password'; icon.className = 'bi bi-eye'; }
}
</script>
{% endblock %}
