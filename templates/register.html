{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-85 py-5">
  <div class="col-md-5 col-lg-4">
    <div class="text-center mb-4">
      <div class="brand-icon mb-3"><i class="bi bi-person-plus-fill"></i></div>
      <h2 class="fw-bold">Create Account</h2>
      <p class="text-muted">Register to get started</p>
    </div>
    <div class="card login-card p-4">
      <form method="POST" action="/register">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control" placeholder="Min 3 characters" required autofocus>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control" placeholder="Min 4 characters" required>
          </div>
        </div>
        <button type="submit" class="btn btn-success w-100 fw-semibold py-2">
          <i class="bi bi-person-check-fill me-2"></i>Create Account
        </button>
      </form>
      <hr class="my-3">
      <p class="text-center small mb-0 text-muted">
        Already have an account? <a href="/login" class="text-primary fw-semibold">Sign in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
